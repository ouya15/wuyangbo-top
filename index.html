<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            padding: 72px 0 56px;
        }
        .hero-quote {
            font-size: 1.7rem;
            font-weight: 400;
            font-style: italic;
            line-height: 1.55;
            color: var(--text-color);
            margin: 0 0 20px 0;
            letter-spacing: 0.02em;
            font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
        }
        .hero-quote .emphasis {
            color: var(--accent-color);
        }
        .hero-sub {
            font-size: 0.95rem;
            color: var(--secondary-text);
            line-height: 1.8;
            max-width: 520px;
        }
        .divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 0 0 32px 0;
        }
        .section-label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--secondary-text);
            margin-bottom: 18px;
        }
        .post-list {
            list-style: none;
            padding: 0;
            margin: 0 0 28px 0;
        }
        .post-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .post-list li:first-child {
            border-top: 1px solid var(--border-color);
        }
        .post-list a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s;
            flex: 1;
            margin-right: 16px;
        }
        .post-list a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .all-link {
            font-size: 0.88rem;
            color: var(--secondary-text);
            text-decoration: none;
            transition: color 0.2s;
        }
        .all-link:hover {
            color: var(--text-color);
        }
        .coming-soon {
            font-size: 0.92rem;
            color: var(--secondary-text);
            line-height: 1.8;
            padding: 24px;
            background: var(--quote-bg);
            border-radius: 6px;
            border-left: 3px solid var(--warm-glow);
        }
        .coming-soon a {
            color: var(--secondary-text);
            text-decoration: underline;
            text-decoration-color: #d5c9b0;
            text-underline-offset: 3px;
        }
        .coming-soon a:hover {
            color: var(--text-color);
        }
    </style>
</head>

        </div>
    </main>
